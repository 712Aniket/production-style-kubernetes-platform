name: Kubernetes Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Validate Kubernetes, Helm and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.2

      - name: Install Kubeconform
        run: |
          curl -sSfL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.37.0 \
            kubernetes/namespace.yaml \
            kubernetes/frontend-deployment.yaml \
            kubernetes/frontend-service.yaml \
            kubernetes/config/portfolio-configmap.yaml

      - name: Lint Helm chart
        run: |
          helm lint helm/portfolio-frontend

      - name: Render and validate Helm templates
        run: |
          helm template portfolio-frontend \
            helm/portfolio-frontend \
            --namespace portfolio \
            > /tmp/portfolio-rendered.yaml

          kubeconform -strict -summary \
            -kubernetes-version 1.37.0 \
            /tmp/portfolio-rendered.yaml

      - name: Build Docker image
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t portfolio-frontend:${GITHUB_SHA} \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-frontend:${{ github.sha }}
          format: table
          output: trivy-image-report.txt
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-security-report
          path: trivy-image-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/712aniket/production-style-kubernetes-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag portfolio-frontend:${IMAGE_TAG} ${IMAGE_NAME}:${IMAGE_TAG}
          docker tag portfolio-frontend:${IMAGE_TAG} ${IMAGE_NAME}:latest

          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:latest

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package helm/portfolio-frontend \
            --destination dist

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-frontend-helm-chart
          path: dist/*.tgz
          retention-days: 14

  update-gitops-image:
    name: Update GitOps image tag
    needs: validate-and-build
    if: needs.validate-and-build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" helm/portfolio-frontend/overrides/ghcr-values.yaml

          echo "Updated GitOps image tag:"
          grep -n '^  tag:' helm/portfolio-frontend/overrides/ghcr-values.yaml

      - name: Commit and push GitOps update
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/portfolio-frontend/overrides/ghcr-values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps image update required."
          else
            git commit -m "chore(gitops): deploy image ${IMAGE_TAG} [skip ci]"
            git push origin HEAD:main
          fi
